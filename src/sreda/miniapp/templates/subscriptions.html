{% extends "base.html" %}

{% block scripts %}
<!-- Manual smoke (Phase 6):
     1. Open mini-app в TG with ?startapp=lnk_<valid-token>
        → confirm screen rendered, token validated
     2. Tap Подтвердить → POST /consume → success view
     3. Open mini-app с ?startapp=lnk_<expired-token>
        → confirm screen rendered, on tap error toast
     4. Open mini-app с ?startapp=lnk_invalid → confirm не показывается
        (alphabet validate fail)
     5. Cancel button → POST /cancel + close
-->
<script>
(function() {
  "use strict";

  var BUILD_STAMP = "{{ build_stamp }}";

  // Wait for telegram-web-app.js to finish injecting window.Telegram.
  // On Android Telegram 12.6+ (observed on Samsung SM-A566B) this
  // inline script runs BEFORE the head <script src=telegram-web-app>
  // has populated window.Telegram, even though the network load
  // looks completed. Retry every 100ms up to 3s before giving up
  // and rendering the "не удалось открыть" fallback.
  var _bootAttempts = 0;
  function _bootstrap() {
    if (!(window.Telegram && window.Telegram.WebApp)) {
      if (_bootAttempts < 30) {
        _bootAttempts++;
        setTimeout(_bootstrap, 100);
        return;
      }
      // Gave up — proceed with tg=null → fallback branch below will
      // show a clear error with the build stamp.
    }
    _mainInit();
  }

  // Extract initData directly from location.hash — Telegram passes
  // it as a URL fragment BEFORE telegram-web-app.js initialises
  // window.Telegram. Works even when the SDK script never loads
  // (observed on some Android Telegram 12.6 builds). Fragment looks
  // like: #tgWebAppData=<urlencoded>&tgWebAppVersion=...&tgWebAppPlatform=...
  function _initDataFromHash() {
    try {
      var hash = (window.location.hash || "").replace(/^#/, "");
      if (!hash) return "";
      // Try TG format (tgWebAppData=...) first, then MAX format (WebAppData=...).
      var keys = ["tgWebAppData", "WebAppData"];
      var pairs = hash.split("&");
      for (var i = 0; i < pairs.length; i++) {
        var eq = pairs[i].indexOf("=");
        if (eq < 0) continue;
        var key = pairs[i].substring(0, eq);
        for (var k = 0; k < keys.length; k++) {
          if (key === keys[k]) {
            return decodeURIComponent(pairs[i].substring(eq + 1));
          }
        }
      }
    } catch (e) {}
    return "";
  }

  function _mainInit() {
  // TG OR MAX SDK detection. MAX exposes window.WebApp (no .Telegram namespace).
  var tg = (window.Telegram && window.Telegram.WebApp) || window.WebApp;
  // ready()/expand() are driven by the late-SDK poll (_callSdkReadyOnce, defined
  // below) so the Telegram loading overlay lifts even when the async SDK arrives
  // AFTER this hash-fallback bootstrap ran (vex-assistant#102: blank-on-first-
  // open, works-on-refresh).
  _callSdkReadyOnce();

  // Prefer the SDK-provided initData; fall back to hash extraction.
  // Hash format: TG = #tgWebAppData=...; MAX = #WebAppData=... (no tg prefix).
  var initData = (tg && tg.initData) ? tg.initData : _initDataFromHash();
  var $app = document.getElementById("app");

  // Always ping the server once on load with what the client sees — we
  // want server-side confirmation that JS actually ran, what TG reported
  // and which build the client got. This is unauth'd — just diagnostics.
  function _postDiag(reason) {
    try {
      // Hash preview — strip actual user payload, keep only which keys
      // are present so we can tell if Telegram populated the fragment
      // even when the SDK script didn't load. "tgWebAppData,tgWebAppVersion"
      // means it DID populate, we just couldn't read it via window.Telegram.
      var hashKeys = "";
      try {
        var rawHash = (window.location.hash || "").replace(/^#/, "");
        if (rawHash) {
          hashKeys = rawHash.split("&")
            .map(function(p) { return p.split("=")[0]; })
            .filter(Boolean)
            .join(",");
        }
      } catch (e) {}
      fetch("{{ base_url }}/miniapp/api/v1/client-diagnostic", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          reason: reason,
          build: BUILD_STAMP,
          has_tg: !!tg,
          init_data_len: initData ? initData.length : 0,
          hash_keys: hashKeys,
          ua: navigator.userAgent,
        }),
        keepalive: true,
      });
    } catch (e) {}
  }
  _postDiag("page_load");

  // If initData is missing (e.g. page opened in a plain browser or via
  // a shared link outside the Telegram client), server-side auth is
  // impossible. Show a clear, VERY visible message instead of firing
  // requests that will all 401 and leave the user staring at a white
  // screen. Inline styles so we don't depend on theme vars.
  if (!initData) {
    var _isMax = !!(window.WebApp && !window.Telegram);
    var _appName = _isMax ? "МАКС" : "Telegram";
    var msg = !tg
      ? "Это приложение открывается только внутри Telegram или МАКС."
      : "Не удалось получить данные " + _appName + ". Закройте и откройте приложение через бота.";
    console.warn("miniapp: initData missing", {hasTg: !!tg, ua: navigator.userAgent});
    if ($app) {
      $app.innerHTML =
        '<div style="margin:16px;padding:24px;background:#ffeaea;' +
        'border:1px solid #e57373;border-radius:12px;color:#000;">' +
        '<h2 style="margin:0 0 12px 0;font-size:18px;color:#b71c1c;">Не удалось открыть</h2>' +
        '<p style="margin:0 0 12px 0;line-height:1.4;">' + msg + '</p>' +
        '<p style="margin:0;font-size:11px;color:#777;">build ' + BUILD_STAMP + '</p>' +
        '</div>';
    }
    _postDiag("no_init_data");
    return;
  }

  // -- State --
  // ``menu`` — dashboard tiles (skills + Подписки). ``reminders`` lazy-loaded
  // when the user opens #/reminders so we don't hit the DB on every boot.
  var state = {
    summary: null,
    plans: null,
    menu: null,
    reminders: null,
    shopping: null,
    recipes: null,
    recipeDetail: {},
    schedule: null,
    weeklyMenu: null,
    checklists: null,
    checklistDetail: {},  // R-33: per-id cache для detail view
    family: null,
    memory: null,            // #262: список категорий памяти
    memoryFacts: {},         // #262: per-category cache фактов (lazy на раскрытии аккордеона)
    memExpanded: {},         // #262: id категории → раскрыта ли (аккордеон)
    loading: true,
    error: null,
  };

  // #262: режим создания/переименования категории (поле сверху) + режим инлайн-правки факта.
  var _memEditId = null;     // null = создание категории; иначе id переименовываемой категории
  var _factEditId = null;    // id факта в режиме инлайн-правки (иначе null)
  var _MEMORY_TIER_LABELS = { core: "О вас", episodic: "События" };

  var _channelLinkSessionExpired = false;
  var _channelLinkPollIntervalId = null;
  var _channelLinkConfirmShown = false;
  var _channelLinkView = null;
  var _channelLinkToken = null;
  var _channelLinkLastErrorMessage = null;

  function clearChannelLinkPoll() {
    if (_channelLinkPollIntervalId !== null) {
      clearInterval(_channelLinkPollIntervalId);
      _channelLinkPollIntervalId = null;
    }
  }

  // -- API --
  function apiFetch(path, opts) {
    opts = opts || {};
    var headers = { "Authorization": "tma " + initData };
    if (opts.body) headers["Content-Type"] = "application/json";
    // Phase 8 of MAX integration (2026-05-04): add ?platform= query так
    // backend dispatches на правильный validator (R2#6 fail-explicit).
    var fullPath = (typeof window.__sredaWithPlatform === "function")
      ? window.__sredaWithPlatform(path)
      : path;
    return fetch("{{ base_url }}" + fullPath, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function(r) {
      if (r.status === 401) {
        // 2026-04-29: убрали слово «подписки» (Mini App теперь
        // general-purpose — Дела/Покупки/Расписание etc).
        // Action-instruction для юзера: показываем как починить
        // (Telegram кэширует initData при открытии приложения, в
        // пределах TTL 24ч; tap по кнопке меню Telegram-чата
        // генерирует свежий initData).
        state.error = (
          "Сессия истекла. Закрой приложение и открой заново — " +
          "тапни кнопку «Приложение» под полем ввода в чате с ботом, " +
          "или открой через меню Telegram-чата."
        );
        render();
        throw new Error("auth_expired");
      }
      return r.json();
    });
  }

  function channelLinkApiFetch(path, opts) {
    if (_channelLinkSessionExpired) {
      var expiredErr = new Error("auth_expired");
      expiredErr.status = 401;
      return Promise.reject(expiredErr);
    }
    opts = opts || {};
    var headers = { "Authorization": "tma " + initData };
    var optHeaders = opts.headers || {};
    for (var h in optHeaders) {
      if (Object.prototype.hasOwnProperty.call(optHeaders, h)) {
        headers[h] = optHeaders[h];
      }
    }
    if (opts.body !== undefined && !headers["Content-Type"]) {
      headers["Content-Type"] = "application/json";
    }
    var fullPath = (typeof window.__sredaWithPlatform === "function")
      ? window.__sredaWithPlatform(path)
      : path;
    return fetch("{{ base_url }}" + fullPath, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body,
    }).then(function(r) {
      return r.text().then(function(text) {
        var data = null;
        if (text) {
          try { data = JSON.parse(text); }
          catch (e) { data = { detail: text }; }
        }
        if (r.status === 401) {
          if (!_channelLinkSessionExpired) {
            _channelLinkSessionExpired = true;
            state.error = (
              "Сессия истекла. Закрой приложение и открой заново — " +
              "тапни кнопку «Приложение» под полем ввода в чате с ботом, " +
              "или открой через меню Telegram-чата."
            );
            clearChannelLinkPoll();
            render();
          }
          var authErr = new Error("auth_expired");
          authErr.status = 401;
          authErr.response = data || {};
          authErr.detail = authErr.response.detail;
          return Promise.reject(authErr);
        }
        if (!r.ok) {
          var err = new Error("HTTP " + r.status);
          err.status = r.status;
          err.response = data || {};
          err.detail = err.response.detail;
          throw err;
        }
        return data || {};
      });
    });
  }

  var CHANNEL_LINK_TOKEN_RE = /^[A-Za-z0-9_-]{32,128}$/;

  function isValidChannelLinkToken(token) {
    return CHANNEL_LINK_TOKEN_RE.test(token || "");
  }

  function getChannelLinkToken() {
    var initDataUnsafe = window.bridge && window.bridge.initDataUnsafe
      ? window.bridge.initDataUnsafe()
      : null;
    var sp = initDataUnsafe && initDataUnsafe.start_param;
    if (typeof sp !== "string" || !sp.startsWith("lnk_")) return null;
    var token = sp.slice(4);
    if (!isValidChannelLinkToken(token)) return null;
    return token;
  }

  function channelLinkErrorMessage(code) {
    var messages = {
      account_already_registered_separately:
        "У тебя уже есть отдельный Sreda-аккаунт в этом мессенджере. Напиши в @sreda_support, мы свяжем.",
      already_linked_other_account:
        "К этому Sreda-юзеру уже привязан другой аккаунт",
      account_belongs_to_other_family_member:
        "Этот аккаунт принадлежит другому члену семьи",
      not_found_or_expired:
        "Ссылка истекла или уже использована",
    };
    return messages[code] || "Не удалось связать аккаунты. Попробуй позже.";
  }

  // loadData supports a silent mode used by the visibility-refresh path:
  // we don't null state before the fetch and we don't set state.loading
  // (which would replace the dashboard with a spinner for 200–500ms).
  // Instead we keep the old data visible, fetch in the background, and
  // only re-render when fresh data has overwritten the slots. Without
  // this, tapping a dashboard card (e.g. "Меню недели") right after
  // the Mini App becomes visible ate into the loading placeholder and
  // the user had to tap twice.
  function loadData(opts) {
    var silent = !!(opts && opts.silent);
    if (!silent) {
      state.loading = true;
      state.error = null;
      render();
    }
    return Promise.all([
      apiFetch("/miniapp/api/v1/summary"),
      apiFetch("/miniapp/api/v1/plans"),
      apiFetch("/miniapp/api/v1/menu"),
    ]).then(function(results) {
      state.summary = results[0];
      state.plans = results[1];
      state.menu = results[2];
      state.loading = false;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.loading = false;
        if (!silent) state.error = "Не удалось загрузить данные.";
        render();
      }
    });
  }

  function loadReminders() {
    return apiFetch("/miniapp/api/v1/reminders").then(function(res) {
      state.reminders = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.reminders = { items: [], _error: true };
        render();
      }
    });
  }

  function loadSchedule() {
    // First-page load: current week (no start param) + inbox.
    return apiFetch("/miniapp/api/v1/schedule/week").then(function(res) {
      state.schedule = {
        weeks: [{ week_start: res.week_start, days: res.days || [] }],
        inbox: res.inbox || [],
        loading: false,
        _error: false,
      };
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.schedule = {
          weeks: [], inbox: [], loading: false, _error: true,
        };
        render();
      }
    });
  }

  function loadNextWeek() {
    // Appends the week AFTER the last loaded week to state.schedule.
    // Button is click-to-load, not scroll-based — keeps behaviour
    // predictable on Mini App constrained viewports.
    if (!state.schedule || state.schedule.loading) return;
    var weeks = state.schedule.weeks || [];
    if (weeks.length === 0) return;
    var lastStart = weeks[weeks.length - 1].week_start;
    // +7 days from the last start, as YYYY-MM-DD. Compute in JS to
    // avoid a server round-trip; the endpoint itself will accept any
    // valid ISO date and just return that Monday-aligned week.
    var d = new Date(lastStart + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + 7);
    var nextStart = d.toISOString().slice(0, 10);

    state.schedule.loading = true;
    render();
    apiFetch("/miniapp/api/v1/schedule/week?start=" + nextStart)
      .then(function(res) {
        state.schedule.weeks.push({
          week_start: res.week_start, days: res.days || [],
        });
        state.schedule.loading = false;
        render();
      })
      .catch(function(err) {
        state.schedule.loading = false;
        if (err.message !== "auth_expired") render();
      });
  }

  function loadShopping() {
    return apiFetch("/miniapp/api/v1/shopping").then(function(res) {
      state.shopping = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.shopping = { items: [], _error: true };
        render();
      }
    });
  }

  function loadChecklists() {
    return apiFetch("/miniapp/api/v1/checklists").then(function(res) {
      state.checklists = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.checklists = { checklists: [], _error: true };
        render();
      }
    });
  }

  function loadRecipes() {
    return apiFetch("/miniapp/api/v1/recipes").then(function(res) {
      state.recipes = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.recipes = { items: [], _error: true };
        render();
      }
    });
  }

  function loadRecipeDetail(recipeId) {
    return apiFetch("/miniapp/api/v1/recipes/" + recipeId).then(function(res) {
      state.recipeDetail[recipeId] = res.recipe;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.recipeDetail[recipeId] = { _error: true };
        render();
      }
    });
  }

  // R-33 (2026-05-15): single checklist detail loader (used by
  // #/checklists/{id} route navigated from schedule task с linked
  // checklist). Endpoint returns object directly (not wrapped).
  function loadChecklistDetail(checklistId) {
    return apiFetch(
      "/miniapp/api/v1/checklist/" + encodeURIComponent(checklistId)
    ).then(function(res) {
      state.checklistDetail[checklistId] = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.checklistDetail[checklistId] = { _error: true };
        render();
      }
    });
  }

  function loadFamily() {
    return apiFetch("/miniapp/api/v1/family").then(function(res) {
      state.family = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.family = { items: [], _error: true };
        render();
      }
    });
  }

  // #262: память — категории (список) + факты категории (read-only).
  function loadMemory() {
    return apiFetch("/miniapp/api/v1/memory/categories").then(function(res) {
      state.memory = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.memory = { categories: [], _error: true };
        render();
      }
    });
  }

  function loadMemoryFacts(categoryId) {
    // In-flight sentinel (ревью C2): пока запрос летит, кэш не undefined → повторный re-render раскрытой
    // категории НЕ вызовет дубль GET (rapid collapse/expand или unrelated render до ответа).
    state.memoryFacts[categoryId] = { facts: [], _loading: true };
    return apiFetch(
      "/miniapp/api/v1/memory/facts?category_id=" + encodeURIComponent(categoryId)
    ).then(function(res) {
      state.memoryFacts[categoryId] = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.memoryFacts[categoryId] = { facts: [], _error: true };
        render();
      }
    });
  }

  function doAction(path, body) {
    return apiFetch(path, { method: "POST", body: body || {} })
      .then(function(res) {
        if (res.summary) state.summary = res.summary;
        return res;
      })
      .then(function() { return loadData(); });
  }

  function showPopup(message, onOk) {
    if (tg && tg.showPopup) {
      // Buttons need explicit `id` — without it, the callback receives
      // an empty string for type:"ok" and we'd never trigger onOk().
      tg.showPopup(
        {
          message: message,
          buttons: [
            { id: "ok", type: "default", text: "Да" },
            { id: "cancel", type: "default", text: "Отмена" }
          ]
        },
        function(btn) { if (btn === "ok") onOk(); }
      );
    } else {
      if (confirm(message)) onOk();
    }
  }

  function showAlert(message) {
    if (tg && tg.showAlert) tg.showAlert(message);
    else alert(message);
  }

  // -- Routing --
  function getRoute() {
    var hash = location.hash || "#/";
    return hash.replace(/^#/, "") || "/";
  }

  function navigate(path) {
    location.hash = "#" + path;
  }

  // Telegram.WebApp.BackButton.onClick() SUBSCRIBES a new handler on
  // every call without replacing — after N navigations, one tap fires
  // all N handlers and history.back() runs N times, jumping past the
  // previous screen. Track the active callback and unsubscribe it
  // before installing a new one.
  var _backHandler = null;

  function setupBackButton(show) {
    if (!tg || !tg.BackButton) return;
    if (_backHandler) {
      try { tg.BackButton.offClick(_backHandler); } catch (e) {}
      _backHandler = null;
    }
    if (show) {
      _backHandler = function() {
        // On the main screen there's nothing to go back to — guard
        // against it even though setupBackButton(false) should keep
        // us out of this branch.
        if (getRoute() === "/") return;
        history.back();
      };
      tg.BackButton.onClick(_backHandler);
      tg.BackButton.show();
    } else {
      tg.BackButton.hide();
    }
  }

  // -- Helpers --
  function formatDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    var dd = String(d.getDate()).padStart(2, "0");
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var yyyy = d.getFullYear();
    return dd + "." + mm + "." + yyyy;
  }

  // Human-friendly datetime used on the reminders page. Today / tomorrow
  // get relative prefixes; further dates show day + month. Renders in
  // the device's locale so the Telegram user sees their own timezone.
  function formatDateTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var tmrw = new Date(now.getTime() + 86400000);
    var isTomorrow = d.toDateString() === tmrw.toDateString();
    var timeStr = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    if (sameDay) return "Сегодня в " + timeStr;
    if (isTomorrow) return "Завтра в " + timeStr;
    var dateStr = d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
    return dateStr + ", " + timeStr;
  }

  function formatPrice(rub) {
    if (!rub || rub === 0) return "Бесплатно";
    return rub.toLocaleString("ru-RU") + " \u20bd / мес";
  }

  function escHtml(s) {
    if (!s) return "";
    var el = document.createElement("span");
    el.textContent = s;
    return el.innerHTML;
  }

  // R-31 (2026-05-15, Codex R2 MAJOR fix): escape для HTML attribute context.
  // `escHtml` использует textContent→innerHTML которое escape'ит `<>&` но НЕ `"`,
  // т.к. `"` валиден в text node. Для attribute value нужно явно escape кавычки.
  function escAttr(s) {
    return escHtml(s).replace(/"/g, "&quot;");
  }

  function findPlan(planKey) {
    if (!state.plans || !state.plans.plans) return null;
    for (var i = 0; i < state.plans.plans.length; i++) {
      if (state.plans.plans[i].plan_key === planKey) return state.plans.plans[i];
    }
    return null;
  }

  // -- Renderers --

  function renderLoading() {
    return '<div class="loading"><div class="spinner"></div></div>';
  }

  function renderError() {
    return '<div class="error-state">' + escHtml(state.error) + '</div>';
  }

  function currentMessengerLabel() {
    return window.__SREDA_PLATFORM__ === "max" ? "MAX" : "Telegram";
  }

  function renderChannelLinkConfirm() {
    setupBackButton(false);
    var messenger = currentMessengerLabel();
    var html = '<h1>Связь аккаунтов</h1>';
    html += '<div class="card">';
    html += '<div class="card-title">Привязать аккаунт ' + escHtml(messenger) + ' к Sreda юзеру?</div>';

  // Human-readable RRULE summary for reminder cards. Covers the
  // common shapes the LLM emits (FREQ=DAILY / WEEKLY BYDAY=...).
  // Unknown shapes fall back to the raw RRULE so the user at least
  // sees SOMETHING rather than «undefined».
  var _DOW_RU = {
    MO: "понедельник", TU: "вторник", WE: "среда", TH: "четверг",
    FR: "пятница", SA: "суббота", SU: "воскресенье",
  };
  var _DOW_RU_PLURAL = {
    MO: "понедельникам", TU: "вторникам", WE: "средам", TH: "четвергам",
    FR: "пятницам", SA: "субботам", SU: "воскресеньям",
  };
  function formatRRule(rule) {
    if (!rule) return "";
    var parts = {};
    rule.split(";").forEach(function(chunk) {
      var kv = chunk.split("=");
      if (kv.length === 2) parts[kv[0]] = kv[1];
    });
    var freq = parts.FREQ;
    var byday = parts.BYDAY;
    if (freq === "DAILY") {
      if (byday === "MO,TU,WE,TH,FR") return "по будням";
      if (byday === "SA,SU") return "по выходным";
      return "каждый день";
    }
    if (freq === "WEEKLY") {
      if (!byday) return "каждую неделю";
      var days = byday.split(",");
      if (days.length === 1 && _DOW_RU[days[0]]) {
        return "каждый " + _DOW_RU[days[0]];
      }
      var names = days.map(function(d) {
        return _DOW_RU_PLURAL[d] || d;
      });
      return "по " + names.join(", ");
    }
    if (freq === "MONTHLY") return "каждый месяц";
    if (freq === "YEARLY") return "каждый год";
    return rule;  // fallback: still better than nothing
  }

  function renderReminders() {

  // --- Screen: Schedule (#/schedule) ---
  // Day labels (e.g. «Четверг, 23 апреля») now come from the server
  // in each day object's ``label`` field, generated by _day_label()
  // in miniapp.py. No JS locale tables needed.

  // Render a single task card (flat row). Used for both dated days
  // and the top-of-page inbox section — shape identical.
  function _renderTaskRow(t) {
    var iconsPrefix = "";
    if (t.is_recurring) iconsPrefix += "\uD83D\uDD04 ";   // 🔄
    if (t.has_reminder) iconsPrefix += "\uD83D\uDD14 ";   // 🔔

    // R-33 (2026-05-15, Boris update): если task linked с checklist →
    // inline accordion прямо в расписании. Tap → раскрывается, items
    // загружаются lazy через loadChecklistDetail.
    if (t.checklist_id) {
      var counterText = "";
      if (t.checklist_total != null && t.checklist_total > 0) {
        counterText = t.checklist_pending + "/" + t.checklist_total;
      }
      var hAcc = '<details class="task-card" data-task-id="' + escAttr(t.id) + '" '
        + 'data-checklist-id="' + escAttr(t.checklist_id) + '" '
        + 'style="padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06)" '
        + 'ontoggle="window._onTaskAccordionToggle(this)">';
      hAcc += '<summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px">';
      hAcc += '<div style="font-weight:500;flex:1;min-width:0">' + iconsPrefix + escHtml(t.title) + '</div>';
      // Counter — stable selector .task-cl-counter для DOM patch после item toggle.
      hAcc += '<span class="task-cl-counter" data-checklist-id="' + escAttr(t.checklist_id) + '" '
        + 'style="font-size:13px;opacity:0.7;flex-shrink:0' + (counterText ? '' : ';display:none') + '">'
        + (counterText ? '📋 ' + counterText : '')
        + '</span>';
      hAcc += '</summary>';
      // Items container — lazy filled by _onTaskAccordionToggle на first open.
      hAcc += '<div class="task-checklist-items" style="margin-top:8px"></div>';
      // Meta bits (time, reminder, delegated, notes) — те же что для plain row.
      var metaBitsAcc = [];
      if (t.time_start) {
        metaBitsAcc.push(t.time_end
          ? (t.time_start + "–" + t.time_end)
          : t.time_start);
      }
      if (t.has_reminder && t.reminder_offset_minutes) {
        metaBitsAcc.push("напомнить за " + t.reminder_offset_minutes + " мин");
      }
      if (t.delegated_to) {
        metaBitsAcc.push("поручено: " + escHtml(t.delegated_to));
      }
      if (metaBitsAcc.length > 0) {
        hAcc += '<div class="card-subtitle" style="margin-top:2px">' + metaBitsAcc.join(" · ") + '</div>';
      }
      if (t.notes) {
        hAcc += '<div class="card-subtitle" style="margin-top:2px;font-style:italic">' + escHtml(t.notes) + '</div>';
      }
      hAcc += '</details>';
      return hAcc;
    }

    // Без linked checklist — простой row.
    var h = '<div style="padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06)">';
    h += '<div style="font-weight:500">' + iconsPrefix + escHtml(t.title) + '</div>';
    var metaBits = [];
    if (t.time_start) {
      metaBits.push(t.time_end
        ? (t.time_start + "–" + t.time_end)
        : t.time_start);
    }
    if (t.has_reminder && t.reminder_offset_minutes) {
      metaBits.push("напомнить за " + t.reminder_offset_minutes + " мин");
    }
    if (t.delegated_to) {
      metaBits.push("поручено: " + escHtml(t.delegated_to));
    }
    if (metaBits.length > 0) {
      h += '<div class="card-subtitle" style="margin-top:2px">'
        + metaBits.join(" · ") + '</div>';
    }
    if (t.notes) {
      h += '<div class="card-subtitle" style="margin-top:2px;font-style:italic">'
        + escHtml(t.notes) + '</div>';
    }
    h += '</div>';
    return h;
  }

  // One dated day block: label + either tasks or муted "ничего не запланировано".
  function _renderScheduleDay(day) {
    var h = '<div class="section-title" style="margin:16px 0 8px 4px">';
    h += escHtml(day.label) + '</div>';
    h += '<div class="card" style="padding:4px 12px">';

    if (tasks.length === 0) {
      h += '<div class="card-subtitle" style="padding:8px 0">ничего не запланировано</div>';
    } else {
      for (var i = 0; i < tasks.length; i++) {
        h += _renderTaskRow(tasks[i]);
      }

    h += '</div>';
    return h;
  }

  function renderSchedule() {
    setupBackButton(true);
    var html = '<h1>\uD83D\uDCC5 Расписание</h1>';

    if (state.schedule === null) {
      loadSchedule();
      return html + renderLoading();
    }
    if (state.schedule._error) {
      return html + '<div class="error-state">Не удалось загрузить расписание.</div>';
    }

    var weeks = state.schedule.weeks || [];
    var inbox = state.schedule.inbox || [];
    var totalTasks = inbox.length;
    for (var wi = 0; wi < weeks.length; wi++) {
      var ds = weeks[wi].days || [];
      for (var di = 0; di < ds.length; di++) {
        totalTasks += (ds[di].tasks || []).length;
      }
    }

    // Fully empty state — only show if literally nothing is scheduled
    // in the loaded week and inbox is empty.
    if (totalTasks === 0 && weeks.length <= 1) {
      html += '<div class="empty-state">';
      html += 'На этой неделе задач не запланировано.<br><br>';
      html += 'Скажи Среде: «поставь задачу прогуляться в 18:00» ';
      html += 'или «добавь утреннюю разминку каждый будний день».';
      html += '</div>';
      // Still allow "next week" from empty state.
      html += '<button class="schedule-next-week" onclick="window._loadNextWeek()"';
      html += (state.schedule.loading ? ' disabled' : '') + '>';
      html += (state.schedule.loading ? 'Загружаю…' : 'Показать следующую неделю ▾');
      html += '</button>';
      return html;
    }

    // Inbox section — only rendered if it has items (server puts it in
    // the FIRST week response only; subsequent "next week" responses
    // return inbox: []).
    if (inbox.length > 0) {
      html += '<div class="section-title" style="margin:16px 0 8px 4px">';
      html += '\uD83D\uDCE5 Без даты</div>';  // 📥
      html += '<div class="card" style="padding:4px 12px">';
      for (var ii = 0; ii < inbox.length; ii++) {
        html += _renderTaskRow(inbox[ii]);
      }
      html += '</div>';
    }

    // Weeks loop. Past days in the FIRST loaded week get wrapped in
    // a <details> collapse so the current day lands at the top of
    // the open list. Subsequent weeks are fully future — no collapse.
    for (var w = 0; w < weeks.length; w++) {
      var week = weeks[w];
      var days = week.days || [];
      var pastDays = [];
      var futureDays = [];
      for (var j = 0; j < days.length; j++) {
        (days[j].is_past ? pastDays : futureDays).push(days[j]);
      }

      if (pastDays.length > 0) {
        html += '<details class="schedule-past-collapse">';
        html += '<summary>\uD83D\uDCCB Прошедшие дни</summary>';  // 📋
        for (var p = 0; p < pastDays.length; p++) {
          html += _renderScheduleDay(pastDays[p]);
        }
        html += '</details>';
      }
      for (var f = 0; f < futureDays.length; f++) {
        html += _renderScheduleDay(futureDays[f]);
      }
    }

    // Load-next-week button — always at the very end, rebuilt on every
    // render so pushing a new week into state.schedule.weeks just
    // re-appends days before the button.
    html += '<button class="schedule-next-week" onclick="window._loadNextWeek()"';
    html += (state.schedule.loading ? ' disabled' : '') + '>';
    html += (state.schedule.loading ? 'Загружаю…' : 'Показать следующую неделю ▾');
    html += '</button>';

    // Voice-only hint. Read-only Mini App: all edits via chat.
    html += '<div class="card-subtitle" ';
    html += 'style="text-align:center;margin-top:16px;padding:0 8px;line-height:1.4">';
    html += 'Для изменения или удаления задачи просто скажи Среде голосом.';
    html += '</div>';
    return html;
  }

  // --- Screen: Weekly menu (#/menu) — READ-ONLY (#235) ---
  // Card+screen removed 2026-04-22 (editing UX unfinished); restored
  // 2026-06-25 as read-only viewing. All edits go through voice.
  var _MENU_DAYS_RU = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
  var _MEAL_LABELS = {
    "breakfast": "Завтрак",
    "lunch": "Обед",
    "dinner": "Ужин",
    "snack": "Перекус"
  };
  var _MEAL_ORDER = ["breakfast", "lunch", "dinner", "snack"];

  function loadWeeklyMenu() {
    return apiFetch("/miniapp/api/v1/weekly-menu").then(function(res) {
      state.weeklyMenu = res;
      render();
    }).catch(function(err) {
      if (err.message !== "auth_expired") {
        state.weeklyMenu = { plan: null, _error: true };
        render();
      }
    });
  }

  function renderWeeklyMenu() {
    setupBackButton(true);
    var html = '<h1>🍽 Меню недели</h1>';

    if (state.weeklyMenu === null) {
      loadWeeklyMenu();
      return html + renderLoading();
    }
    if (state.weeklyMenu._error) {
      return html + '<div class="error-state">Не удалось загрузить меню.</div>';
    }

    var plan = state.weeklyMenu.plan;
    if (!plan) {
      html += '<div class="empty-state">';
      html += 'Меню пока пусто.<br><br>';
      html += 'Напиши боту: «составь меню на неделю» — Среда подберёт ';
      html += 'блюда с учётом твоей семьи и сохранённых рецептов.';
      html += '</div>';
      return html;
    }

    // Index items by (day, meal_type) for O(1) cell lookup.
    var byCell = {};
    var allItems = plan.items || [];
    for (var i = 0; i < allItems.length; i++) {
      var it = allItems[i];
      byCell[it.day_of_week + ":" + it.meal_type] = it;
    }

    if (plan.week_start_date) {
      html += '<div class="card-subtitle" style="margin-bottom:12px">с ' + escHtml(plan.week_start_date) + '</div>';
    }

    for (var d = 0; d < 7; d++) {
      // Day-total calories (sum of recipe cells that carry per-serving kcal).
      var dayKcal = 0;
      var kcalHasAny = false;
      for (var mk = 0; mk < _MEAL_ORDER.length; mk++) {
        var ck = byCell[d + ":" + _MEAL_ORDER[mk]];
        if (ck && ck.recipe_calories != null) {
          dayKcal += ck.recipe_calories;
          kcalHasAny = true;
        }
      }
      var title = _MENU_DAYS_RU[d];
      if (kcalHasAny) {
        title += " · ~" + Math.round(dayKcal) + " ккал";
      }

      html += '<div class="section-title" style="margin:20px 0 8px 4px">' + escHtml(title) + '</div>';
      html += '<div class="card" style="padding:8px 12px">';
      for (var m = 0; m < _MEAL_ORDER.length; m++) {
        var mealType = _MEAL_ORDER[m];
        var cell = byCell[d + ":" + mealType];
        var dish;
        if (cell && cell.recipe_title) {
          dish = escHtml(cell.recipe_title);
        } else if (cell && cell.free_text) {
          dish = escHtml(cell.free_text);
        } else {
          dish = '—'; // —
        }
        html += '<div style="padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06)">';
        html += '<span class="card-subtitle" style="display:inline-block;min-width:90px">' + escHtml(_MEAL_LABELS[mealType]) + ':</span> ';
        html += '<span>' + dish + '</span>';
        html += '</div>';
      }

  // Surgical animate-and-remove for one shopping item. checked=true
  // plays a green checkmark animation first (bought), checked=false
  // skips straight to collapse (delete/cancel). 700ms total for the
  // happy "tick → fade → collapse" sequence; 350ms for the direct
  // delete path. After collapse we prune from state + DOM.
  function _animateRemoveShoppingItem(itemId, checked) {
    var card = document.querySelector('[data-shop-item="' + itemId + '"]');
    if (!card) {
      // Card already gone; just prune state.
      _pruneShoppingItemFromState(itemId);
      return;
    }
    var delayBeforeFade = 0;
    if (checked) {
      var check = card.querySelector(".shop-check");
      if (check) {
        check.style.background = "#2ecc71";
        check.style.borderColor = "#2ecc71";
        check.style.color = "#fff";
      }
      var text = card.querySelector(".shop-text");
      if (text) text.style.textDecoration = "line-through";
      delayBeforeFade = 350;
    }
    setTimeout(function() {
      card.style.opacity = "0";
      card.style.maxHeight = "0px";
      card.style.padding = "0";
      card.style.margin = "0";
      setTimeout(function() {
        if (card.parentNode) card.parentNode.removeChild(card);
        _pruneShoppingItemFromState(itemId);
      }, 380);
    }, delayBeforeFade);
  }

  // Remove the item from state.shopping.items AND clean up the
  // category header if that was the last item in its bucket. Also
  // updates the "Всего: N" counter. If the list becomes empty, we
  // do a single render() so the empty-state message appears.
  function _pruneShoppingItemFromState(itemId) {
    if (!state.shopping || !state.shopping.items) return;
    var removedCat = null;
    state.shopping.items = state.shopping.items.filter(function(it) {
      if (it.id === itemId) { removedCat = it.category; return false; }
      return true;
    });
    // Dashboard tile counter is stale — silently refresh.
    state.menu = null;
    loadData({silent: true});

    // Category header cleanup — if no remaining items share the
    // removed category, drop the header too.
    if (removedCat) {
      var still = state.shopping.items.some(function(it) { return it.category === removedCat; });
      if (!still) {
        var hdr = document.querySelector('.section-title[data-shop-cat="' + removedCat + '"]');
        if (hdr && hdr.parentNode) hdr.parentNode.removeChild(hdr);
      }
    }

    var total = document.getElementById("shop-total");
    if (total) total.textContent = "Всего: " + state.shopping.items.length;

    if (state.shopping.items.length === 0) {
      // Show the empty state banner.
      render();
    }
  }

  // 2026-04-28: tap-toggle pending ↔ done через POST API.
  // Optimistic UI: галочка меняется СРАЗУ, потом запрос. На ошибке —
  // откат. Юзеры жаловались что галочки не реагируют — фикс.
  window._toggleChecklistItem = function(rowEl, itemId) {
    var markEl = rowEl.querySelector('.cl-mark');
    var textEl = rowEl.querySelector('.cl-text');
    if (!markEl || !textEl) return;

    var DONE_MARK = '☑';  // checked box
    var TODO_MARK = '☐';  // empty box
    var wasDone = markEl.textContent === DONE_MARK;
    var newMark = wasDone ? TODO_MARK : DONE_MARK;
    var newTextStyle = wasDone
      ? 'flex:1;'
      : 'flex:1;text-decoration:line-through;opacity:0.55';

    // Optimistic UI flip
    markEl.textContent = newMark;
    textEl.setAttribute('style', newTextStyle);

    // Telegram haptic feedback
    try {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
    } catch (_e) { /* noop */ }

    apiFetch("/miniapp/api/v1/checklist/items/" + itemId + "/toggle", {
      method: "POST",
    }).then(function(res) {
      if (!res || res.ok !== true) {
        markEl.textContent = wasDone ? DONE_MARK : TODO_MARK;
        textEl.setAttribute('style', wasDone
          ? 'flex:1;text-decoration:line-through;opacity:0.55'
          : 'flex:1;');
        return;
      }
      // 2026-04-29: in-place patch без full re-render. Раньше делали
      // `state.checklists = null; render();` — full re-fetch + redraw,
      // юзер видел flash of empty content («page reload»). Теперь:
      // patch state в памяти + обновляем counter на <summary>
      // напрямую. <details open/close> не дёргается, scroll не
      // сбрасывается. Если patch не нашёл item (тип gone от соседней
      // сессии) — ничего не падаем; на следующей навигации refresh.
      try {
        var lists = (state.checklists && state.checklists.checklists) || [];
        for (var li = 0; li < lists.length; li++) {
          var cl = lists[li];
          var its = cl.items || [];
          for (var ii = 0; ii < its.length; ii++) {
            if (its[ii].id !== itemId) continue;
            its[ii].status = wasDone ? 'pending' : 'done';
            // Recompute aggregates by replaying статусов.
            var pending = 0, done = 0;
            for (var k = 0; k < its.length; k++) {
              if (its[k].status === 'done') done += 1;
              else if (its[k].status !== 'cancelled') pending += 1;
            }
            cl.pending = pending;
            cl.done = done;
            // Patch <summary> counter в DOM — checklist list view (R-31).
            try {
              var det = rowEl.closest('details');
              if (det) {
                var sub = det.querySelector('summary .card-subtitle');
                if (sub) sub.textContent = pending + ' / ' + (cl.total || its.length);
              }
            } catch (_e) { /* DOM patch best-effort */ }
            break;
          }
        }
      } catch (_e) { /* state patch best-effort */ }

      // R-33 Boris update 2026-05-15 (Codex+Qwen R1 MEDIUM): also patch
      // state.checklistDetail (used by schedule accordion + standalone
      // detail view) + DOM counter в schedule accordion via stable
      // .task-cl-counter[data-checklist-id] selector. Stale counter
      // после toggle item был MEDIUM finding обоих reviewers.
      try {
        if (state.checklistDetail) {
          for (var cid in state.checklistDetail) {
            if (!Object.prototype.hasOwnProperty.call(state.checklistDetail, cid)) continue;
            var d = state.checklistDetail[cid];
            if (!d || d._error || !d.items) continue;
            for (var di = 0; di < d.items.length; di++) {
              if (d.items[di].id !== itemId) continue;
              d.items[di].status = wasDone ? 'pending' : 'done';
              // Recompute aggregates
              var dPending = 0, dDone = 0;
              for (var dk = 0; dk < d.items.length; dk++) {
                if (d.items[dk].status === 'done') dDone += 1;
                else if (d.items[dk].status !== 'cancelled') dPending += 1;
              }
              d.pending = dPending;
              d.done = dDone;
              // Patch schedule accordion counter (stable selector).
              try {
                var counters = document.querySelectorAll(
                  '.task-cl-counter[data-checklist-id="' + cid + '"]'
                );
                for (var ci = 0; ci < counters.length; ci++) {
                  if (d.total > 0) {
                    counters[ci].textContent = '📋 ' + dPending + '/' + d.total;
                    counters[ci].style.display = '';
                  } else {
                    counters[ci].textContent = '';
                    counters[ci].style.display = 'none';
                  }
                }
              } catch (_de) { /* DOM patch best-effort */ }
              break;
            }
          }
        }
      } catch (_e) { /* checklistDetail patch best-effort */ }
    }).catch(function(_err) {
      markEl.textContent = wasDone ? DONE_MARK : TODO_MARK;
      textEl.setAttribute('style', wasDone
        ? 'flex:1;text-decoration:line-through;opacity:0.55'
        : 'flex:1;');
    });
  };

  // --- Screen: Recipe detail (#/recipes/{id}) ---
  function renderRecipeDetail(recipeId) {
    setupBackButton(true);
    var html = '';

    var detail = state.recipeDetail[recipeId];
    if (!detail) {
      loadRecipeDetail(recipeId);
      return renderLoading();
    }
    if (detail._error) {
      return '<div class="error-state">Рецепт не найден.</div>';
    }

    var badge = _RECIPE_SOURCE_BADGES[detail.source] || "❔";
    var sourceLabel = _RECIPE_SOURCE_LABELS[detail.source] || detail.source;

    html += '<h1>' + badge + ' ' + escHtml(detail.title) + '</h1>';
    html += '<div class="card-subtitle">Источник: ' + escHtml(sourceLabel);
    if (detail.source_url) {
      html += ' <a href="' + escHtml(detail.source_url) + '">ссылка</a>';
    }
    html += '</div>';
    html += '<div class="card-subtitle">На ' + detail.servings + ' чел</div>';

    // Nutrition — per-serving if available. Skip block entirely if
    // all four are null (recipe saved before nutrition rollout or
    // LLM couldn't estimate).
    var nutriBits = [];
    if (detail.calories_per_serving != null) {
      nutriBits.push(Math.round(detail.calories_per_serving) + ' ккал');
    }
    if (detail.protein_per_serving != null) {
      nutriBits.push('Б ' + Math.round(detail.protein_per_serving) + 'г');
    }
    if (detail.fat_per_serving != null) {
      nutriBits.push('Ж ' + Math.round(detail.fat_per_serving) + 'г');
    }
    if (detail.carbs_per_serving != null) {
      nutriBits.push('У ' + Math.round(detail.carbs_per_serving) + 'г');
    }
    if (nutriBits.length) {
      html += '<div class="card-subtitle">На порцию: ' + nutriBits.join(' · ') + '</div>';
    }

    if (detail.ingredients && detail.ingredients.length) {
      html += '<div class="section-title">Ингредиенты</div>';
      html += '<div class="card">';
      for (var i = 0; i < detail.ingredients.length; i++) {
        var ing = detail.ingredients[i];
        var qty = ing.quantity_text ? " — " + escHtml(ing.quantity_text) : "";
        var opt = ing.is_optional ? " <em>(по желанию)</em>" : "";
        html += '<div>• ' + escHtml(ing.title) + qty + opt + '</div>';
      }
      html += '</div>';
    }

    if (detail.instructions_md) {
      html += '<div class="section-title">Приготовление</div>';
      html += '<div class="card" style="white-space:pre-wrap">' + escHtml(detail.instructions_md) + '</div>';
    }

    html += '<div class="mt-16 text-right">';
    html += '<button class="btn btn-danger btn-small" onclick="window._deleteRecipe(\'' + escHtml(detail.id) + '\', \'' + escHtml(detail.title).replace(/\'/g, "") + '\')">Удалить</button>';
    html += '</div>';

    return html;
  }

  function _renderEdsSkillLegacy() {
    setupBackButton(true);
    var s = state.summary;
    var html = '<h1>EDS Monitor</h1>';

    html += '<div class="section-title">Подписки EDS</div>';

    var subs = s.eds_subscriptions || [];
    for (var i = 0; i < subs.length; i++) {
      var sub = subs[i];
      html += '<div class="card">';
      html += '<div class="card-title">' + escHtml(sub.title);
      if (sub.status === "active") {
        html += ' <span class="status-active">\u2713</span>';
      } else if (sub.status === "scheduled_for_cancel") {
        html += ' <span class="status-warning">\u26A0</span>';
      }
      html += '</div>';
      html += '<div class="card-subtitle">' + formatPrice(sub.price_rub) + '</div>';
      html += '<div class="card-subtitle">до ' + formatDate(sub.active_until) + '</div>';

      if (sub.status === "scheduled_for_cancel") {
        html += '<div class="card-subtitle status-warning">Не будет продлена</div>';
      }

      // Connected EDS account
      if (sub.account) {
        var acc = sub.account;
        html += '<div class="eds-account">';
        html += '<div class="eds-account-header">';
        html += '<div>';
        html += '<div class="eds-account-login">' + escHtml(acc.login_masked) + '</div>';
        if (acc.status === "active") {
          html += '<div class="eds-account-status status-active">Активен</div>';
        } else if (acc.status === "scheduled_for_disconnect") {
          html += '<div class="eds-account-status status-warning">Будет отключён</div>';
        } else if (acc.status === "pending_verification") {
          html += '<div class="eds-account-status">Проверка...</div>';
        } else if (acc.status === "auth_failed") {
          html += '<div class="eds-account-status status-warning">Ошибка авторизации</div>';
        } else {
          html += '<div class="eds-account-status">' + escHtml(acc.status) + '</div>';
        }
        html += '</div>';
        if (acc.status === "scheduled_for_disconnect") {
          html += '<button class="btn btn-success btn-small" onclick="window._edsRestore(\'' + escHtml(acc.id) + '\')">Вернуть</button>';
        } else {
          html += '<button class="btn btn-danger btn-small" onclick="window._edsCancel(\'' + escHtml(acc.id) + '\', \'' + escHtml(acc.login_masked) + '\')">Отвязать</button>';
        }
        html += '</div></div>';
      } else if (sub.is_free_slot) {
        // Free slot without connected account
        html += '<div class="card-subtitle mt-8" style="font-style:italic">Кабинет не подключён</div>';
        html += '<button class="btn btn-primary btn-small mt-8" onclick="window._edsConnect()">Подключить ЛК EDS</button>';
      }

      // Cancel/resume subscription
      if (sub.status === "scheduled_for_cancel") {
        html += '<div class="text-right mt-8"><button class="btn btn-success" onclick="window._resume(\'eds_monitor_base\')">Возобновить</button></div>';
      } else if (sub.can_cancel) {
        if (sub.slot_type === "free") {
          html += '<div class="text-right mt-8"><button class="btn btn-danger" onclick="window._removeSlot()">Отменить подписку</button></div>';
        } else {
          html += '<div class="text-right mt-8"><button class="btn btn-danger" onclick="window._cancelEds(\'' + escHtml(sub.cancel_type || "base") + '\')">Отменить подписку</button></div>';
        }
      }

      html += '</div>';
    }

    // Add cabinet button
    html += '<div class="card">';
    html += '<button class="btn btn-primary" onclick="window._addCabinet()">+ Добавить кабинет</button>';
    html += '<div class="card-subtitle mt-8" style="text-align:center">' + formatPrice(s.extra_price_rub || 2990) + '</div>';
    html += '</div>';

    // Renewal section
    if (s.next_payment_due_at && s.next_amount_rub > 0) {
      html += '<div class="section-title">Продление</div>';
      html += '<div class="card">';
      html += '<div class="card-subtitle">Следующий платёж: ' + formatDate(s.next_payment_due_at) + '</div>';
      html += '<div class="card-subtitle">Сумма: ' + s.next_amount_rub.toLocaleString("ru-RU") + ' \u20bd</div>';
      html += '<button class="btn btn-primary mt-16" onclick="window._renew()">Продлить сейчас</button>';
      html += '</div>';
    }

    return html;
  }

        html += '<div class="card-subtitle">до ' + formatDate(skill.active_until) + '</div>';

  // -- Main render --
  // #262: «Память» — категории (CRUD), факты внутри по ярусам (read-only; мутации фактов — голосом).
  function renderMemory() {
    setupBackButton(true);
    var html = '<h1>🧠 Память</h1>';
    html += '<div class="card-subtitle" style="margin-bottom:12px;line-height:1.4">' +
            'Тапните категорию — внутри факты по ярусам; их можно править и удалять.</div>';

    // Поле появляется ТОЛЬКО при переименовании (тап ✏️ на категории). Постоянного «Создать» нет —
    // категории создаются голосом/текстом через бот (решение владельца); Common есть у всех всегда.
    var editing = _memEditId !== null;
    if (editing) {
      var editName = "";
      if (state.memory && state.memory.categories) {
        for (var k = 0; k < state.memory.categories.length; k++) {
          if (state.memory.categories[k].id === _memEditId) { editName = state.memory.categories[k].name; break; }
        }
      }
      html += '<div class="card" id="mem-edit-form" style="display:flex;gap:8px;align-items:center;padding:12px 14px">';
      html += '<input id="mem-cat-name" type="text" maxlength="100" ' +
              'onkeydown="if(event.key===\'Enter\')window._submitMemoryCategory()" ' +
              'placeholder="Новое имя" ' +
              'value="' + escAttr(editName) + '" ' +
              'style="flex:1;min-width:0;border:1px solid var(--tg-theme-hint-color,#ccc);border-radius:8px;' +
              'padding:8px 10px;font-size:15px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000)">';
      html += '<button class="btn btn-primary" onclick="window._submitMemoryCategory()" style="padding:8px 14px;flex-shrink:0">Сохранить</button>';
      html += '<button class="btn btn-small" onclick="window._cancelMemoryEdit()" ' +
              'style="padding:8px 10px;flex-shrink:0;background:rgba(0,0,0,0.06)">Отмена</button>';
      html += '</div>';
    }

    if (state.memory === null) { loadMemory(); return html + renderLoading(); }
    if (state.memory && state.memory._error) {
      return html + '<div class="error-state">Не удалось загрузить память.</div>';
    }
    var cats = (state.memory && state.memory.categories) || [];
    for (var i = 0; i < cats.length; i++) {
      var c = cats[i];
      var expanded = !!state.memExpanded[c.id];
      html += '<div class="card" id="memcat-' + escAttr(c.id) + '" style="padding:0;overflow:hidden">';
      // Шапка категории: тап по названию раскрывает/сворачивает (id в data-attr, не в inline-строке — R-31).
      // Индикатор открытости: раскрытая категория подсвечена фоном + развёрнутый шеврон.
      html += '<div style="display:flex;align-items:center;gap:8px;padding:12px 14px' +
              (expanded ? ';background:var(--tg-theme-secondary-bg-color,#e7ebf0)' : '') + '">';
      html += '<div data-mem-id="' + escAttr(c.id) + '" onclick="window._toggleMemoryCategory(this)" ' +
              'style="flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px">';
      html += '<div class="card-title" id="memtitle-' + escAttr(c.id) + '" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' +
              (expanded ? ';font-weight:600' : '') + '">' + escHtml(c.name) + '</div>';
      html += '<div class="card-subtitle" style="margin:0;flex-shrink:0"><span id="memcount-' + escAttr(c.id) + '">' + (c.fact_count || 0) +
              '</span> <span class="chevron" style="display:inline-block;font-size:15px;transition:transform .15s;' +
              (expanded ? 'transform:rotate(90deg)' : '') + '">▸</span></div>';
      html += '</div>';
      if (!c.is_system) {
        html += '<button type="button" data-mem-id="' + escAttr(c.id) + '" ' +
                'onclick="window._startRenameMemoryCategory(this)" aria-label="Переименовать категорию" ' +
                'style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px">✏️</button>';
        html += '<button type="button" data-mem-id="' + escAttr(c.id) + '" data-mem-name="' + escAttr(c.name) + '" ' +
                'data-mem-count="' + (c.fact_count || 0) + '" onclick="window._deleteMemoryCategory(this)" ' +
                'aria-label="Удалить категорию" style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px;' +
                'color:var(--tg-theme-destructive-text-color,#e53935)">🗑️</button>';
      }
      html += '</div>';
      if (expanded) { html += '<div id="memfacts-' + escAttr(c.id) + '">' + _memoryFactsBodyHtml(c.id) + '</div>'; }
      html += '</div>';
    }
    return html;
  }

  // #262: точечные обновления DOM без полной перерисовки/рефетча (фидбэк юзеров: правка/удаление
  // не должны «перезагружать» интерфейс — мелькание спиннера + прыжок скролла). На УСПЕХЕ мутации
  // правим кэш на месте и перерисовываем только затронутый узел; полный render() остаётся фолбэком.
  function _memCat(catId) {
    var cats = (state.memory && state.memory.categories) || [];
    for (var i = 0; i < cats.length; i++) { if (cats[i].id === catId) return cats[i]; }
    return null;
  }
  function _patchMemoryFactsBody(catId) {
    var el = document.getElementById("memfacts-" + catId);
    if (el) { el.innerHTML = _memoryFactsBodyHtml(catId); return true; }
    return false;
  }
  function _patchMemoryCount(catId) {
    var c = _memCat(catId);
    if (!c) return;
    var el = document.getElementById("memcount-" + catId);
    if (el) { el.textContent = (c.fact_count || 0); }
    // синхронизируем data-mem-count на кнопке удаления категории, иначе stale confirm_count → 409 → рефетч (R2)
    var card = document.getElementById("memcat-" + catId);
    if (card) {
      var delBtn = card.querySelector('button[data-mem-count]');
      if (delBtn) { delBtn.setAttribute("data-mem-count", (c.fact_count || 0)); }
    }
  }

  // Тело раскрытой категории: факты по ярусам (lazy-load при первом раскрытии).
  function _memoryFactsBodyHtml(catId) {
    var data = state.memoryFacts[catId];
    if (data === undefined) { loadMemoryFacts(catId); return '<div style="padding:6px 14px 12px">' + renderLoading() + '</div>'; }
    if (data && data._loading) { return '<div style="padding:6px 14px 12px">' + renderLoading() + '</div>'; }
    if (data && data._error) {
      return '<div class="error-state" style="padding:6px 14px 12px">Не удалось загрузить факты.</div>';
    }
    var facts = (data && data.facts) || [];
    if (facts.length === 0) {
      return '<div style="padding:2px 14px 14px;color:var(--tg-theme-hint-color,#999);font-size:14px;line-height:1.4">' +
             'Пусто. Расскажите мне о себе голосом или текстом — запомню.</div>';
    }
    var out = '<div style="padding:0 14px 10px">';
    var order = ['core', 'episodic'];
    var known = { core: 1, episodic: 1 };
    function group(label, arr) {
      if (!arr.length) return;
      out += '<div class="section-title" style="margin:8px 0 4px">' + escHtml(label) + '</div>';
      for (var j = 0; j < arr.length; j++) { out += _memoryFactCardHtml(arr[j], catId); }
    }
    for (var t = 0; t < order.length; t++) {
      group(_MEMORY_TIER_LABELS[order[t]], facts.filter(function(f) { return f.tier === order[t]; }));
    }
    group('Прочее', facts.filter(function(f) { return !known[f.tier]; }));
    out += '</div>';
    return out;
  }

  // Карточка факта: текст + ✏️/🗑️; в режиме правки (_factEditId) — textarea + Сохранить/Отмена.
  function _memoryFactCardHtml(f, catId) {
    if (_factEditId === f.id) {
      return '<div class="card" style="display:block;background:var(--tg-theme-bg-color,#fff);border-radius:10px;padding:11px 12px;margin-bottom:8px">' +
        '<textarea id="fact-edit-input" maxlength="2000" rows="3" ' +
        'style="width:100%;box-sizing:border-box;border:1px solid var(--tg-theme-hint-color,#ccc);border-radius:8px;' +
        'padding:8px;font-size:15px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000);resize:vertical">' +
        escHtml(f.content) + '</textarea>' +
        '<div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end">' +
        '<button class="btn btn-small" onclick="window._cancelFactEdit()" style="padding:6px 10px;background:rgba(0,0,0,0.06)">Отмена</button>' +
        '<button class="btn btn-primary" data-fact-id="' + escAttr(f.id) + '" data-cat-id="' + escAttr(catId) + '" ' +
        'onclick="window._saveMemoryFact(this)" style="padding:6px 12px">Сохранить</button>' +
        '</div></div>';
    }
    return '<div class="card" style="display:flex;align-items:flex-start;gap:10px;background:var(--tg-theme-bg-color,#fff);border-radius:10px;padding:11px 12px;margin-bottom:8px">' +
      '<div class="card-title" style="margin:0;flex:1;min-width:0;font-weight:normal;line-height:1.4;overflow-wrap:anywhere">' +
      escHtml(f.content) + '</div>' +
      '<button type="button" data-fact-id="' + escAttr(f.id) + '" onclick="window._editMemoryFact(this)" ' +
      'aria-label="Править факт" style="background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px">✏️</button>' +
      '<button type="button" data-fact-id="' + escAttr(f.id) + '" data-cat-id="' + escAttr(catId) + '" ' +
      'onclick="window._deleteMemoryFact(this)" aria-label="Удалить факт" ' +
      'style="background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;color:var(--tg-theme-destructive-text-color,#e53935)">🗑️</button>' +
      '</div>';
  }

  function render() {
    var route = getRoute();
    // TG-Android / MAX quirk fix: initData засовывается в location.hash:
    // - TG: tgWebAppData=...&tgWebAppVersion=...&tgWebAppPlatform=...
    // - MAX: WebAppData=...&WebAppPlatform=...&WebAppVersion=...
    // getRoute() ошибочно интерпретирует это как route → fallback "/" если
    // route начинается с любого из этих префиксов.
    if (route.indexOf("tgWebApp") === 0 || route.indexOf("WebApp") === 0) {
      route = "/";
    }
    var channelLinkToken = getChannelLinkToken();
    if (channelLinkToken && !_channelLinkConfirmShown) {
      _channelLinkConfirmShown = true;
      _channelLinkToken = channelLinkToken;
      _channelLinkView = "confirm";
    }
    if (route !== "/" && _channelLinkPollIntervalId !== null) {
      clearChannelLinkPoll();
    }
    if (_channelLinkView === "success") {
      $app.innerHTML = renderChannelLinkSuccess();
      bindChannelLinkSuccess();
      return;
    }
    if (_channelLinkView === "confirm" && !_channelLinkSessionExpired) {
      $app.innerHTML = renderChannelLinkConfirm();
      bindChannelLinkConfirm(_channelLinkToken);
      return;
    }
    if (state.error) { $app.innerHTML = renderError(); return; }
    if (state.loading) { $app.innerHTML = renderLoading(); return; }

    var html;
    var afterMount = null;

    if (route === "/") {
      html = renderDashboard();
      afterMount = checkChannelLinkStatus;
    } else if (route === "/subscriptions") {
      html = renderSubscriptions();
    } else if (route === "/reminders") {
      html = renderReminders();
    } else if (route === "/schedule") {
      html = renderSchedule();
    } else if (route === "/menu") {
      html = renderWeeklyMenu();
    } else if (route === "/shopping") {
      html = renderShopping();
    } else if (route === "/checklists") {
      html = renderChecklists();
    } else if (route.indexOf("/checklists/") === 0) {
      // R-33 (2026-05-15): single checklist detail view (navigation from
      // schedule task с linked checklist).
      var checklistDetailId = route.replace("/checklists/", "");
      html = renderChecklistDetail(checklistDetailId);
    } else if (route === "/family") {
      html = renderFamily();
    } else if (route === "/recipes") {
      html = renderRecipesList();
    } else if (route.indexOf("/recipes/") === 0) {
      var recipeId = route.replace("/recipes/", "");
      html = renderRecipeDetail(recipeId);
    } else if (route === "/skill/eds_monitor") {
      html = renderEdsSkill();
    } else if (route.indexOf("/skill/") === 0) {
      var featureKey = route.replace("/skill/", "");
      html = renderGenericSkill(featureKey);
    } else if (route === "/catalog") {
      html = renderCatalog();
    } else if (route.indexOf("/catalog/") === 0) {
      var planKey = route.replace("/catalog/", "");
      html = renderPlanDetail(planKey);
    } else if (route === "/memory") {
      html = renderMemory();
    } else {
      html = renderDashboard();
    }

    $app.innerHTML = html;
    if (typeof afterMount === "function") {
      try { afterMount(); }
      catch (e) { console.error("afterMount hook crashed:", e); }
    }
  }

  // #262: память — аккордеон категорий + CRUD категорий + правка/удаление фактов.
  window._toggleMemoryCategory = function(btn) {
    var id = btn.getAttribute("data-mem-id");
    state.memExpanded[id] = !state.memExpanded[id];
    _factEditId = null;  // сворачивая/разворачивая, выходим из режима правки факта
    render();  // renderMemory лениво подгрузит факты раскрытой категории

  window._startRenameMemoryCategory = function(btn) {
    _memEditId = btn.getAttribute("data-mem-id");
    render();

    if (input) { input.focus(); }

  window._cancelMemoryEdit = function() {
    _memEditId = null;
    render();

  window._submitMemoryCategory = function() {
    var input = document.getElementById("mem-cat-name");
    var name = (input && input.value || "").trim();
    if (!name) return;
    // Захват состояния ДО запроса: _memEditId — изменяемое UI-состояние, юзер может начать
    // переименовывать другую категорию до прихода ответа (ревью R1 Codex medium).
    var editId = _memEditId;
    var editing = editId !== null;
    var path = editing
      ? "/miniapp/api/v1/memory/categories/" + encodeURIComponent(editId)
      : "/miniapp/api/v1/memory/categories";
    apiFetch(path, { method: editing ? "PATCH" : "POST", body: { name: name } })
      .then(function(res) {
        if (res && (res.ok || res.category)) {
          var rc = editing ? _memCat(editId) : null;
          if (rc) {
            var newName = (res.category && res.category.name) || name;
            rc.name = newName;
            var titleEl = document.getElementById("memtitle-" + editId);
            if (titleEl) {
              // in-place: правим заголовок + data-mem-name кнопки удаления, без полной перерисовки (R2)
              titleEl.textContent = newName;
              var card = document.getElementById("memcat-" + editId);
              if (card) {
                var delBtn = card.querySelector('button[data-mem-name]');
                if (delBtn) { delBtn.setAttribute("data-mem-name", newName); }
              }
              if (_memEditId === editId) {
                // юзер не начал править другую категорию → убираем форму этой правки
                _memEditId = null;
                var formEl = document.getElementById("mem-edit-form");
                if (formEl && formEl.parentNode) { formEl.parentNode.removeChild(formEl); }
              }
              // если _memEditId !== editId — форма уже принадлежит НОВОЙ правке, не трогаем её черновик
            } else {
              if (_memEditId === editId) { _memEditId = null; }
              render();  // узел заголовка не найден — фолбэк
            }
          } else {
            if (_memEditId === editId) { _memEditId = null; }
            state.memory = null;  // create или разошёлся кэш — ресинк
            render();
          }
        } else if (res && res.detail === "category_name_conflict") {
          showAlert("Категория с таким именем уже есть.");
        } else if (res && res.detail === "category_immutable") {
          showAlert("Категорию «Общее» нельзя изменить.");
        } else {
          showAlert("Не удалось сохранить категорию.");
        }
      })
      .catch(function(err) {
        if (err.message !== "auth_expired") showAlert("Не удалось сохранить категорию.");
      });
  };

  window._deleteMemoryCategory = function(btn) {
    var id = btn.getAttribute("data-mem-id");
    var name = btn.getAttribute("data-mem-name") || "";
    var count = parseInt(btn.getAttribute("data-mem-count") || "0", 10);
    var msg = count > 0
      ? ("Удалить категорию «" + name + "» вместе с " + count + " фактами? Факты удалятся безвозвратно.")
      : ("Удалить категорию «" + name + "»?");
    showPopup(msg, function() {
      apiFetch(
        "/miniapp/api/v1/memory/categories/" + encodeURIComponent(id) + "?confirm_count=" + count,
        { method: "DELETE" }
      ).then(function(res) {
        if (res && res.ok) {
          _memEditId = null;
          _factEditId = null;   // факт удаляемой категории мог быть в режиме правки (ревью R1)
          delete state.memoryFacts[id];   // чистим кэш фактов удалённой категории (ревью B)
          delete state.memExpanded[id];
          if (state.memory && state.memory.categories) {
            state.memory.categories = state.memory.categories.filter(function(cc) { return cc.id !== id; });
          }
          var node = document.getElementById("memcat-" + id);
          if (node && node.parentNode) { node.parentNode.removeChild(node); } else { render(); }
        } else if (res && res.detail === "confirm_count_mismatch") {
          showAlert("Список фактов изменился — обновляю.");
          state.memory = null;
          delete state.memoryFacts[id];
          render();
        } else if (res && res.detail === "category_immutable") {
          showAlert("Категорию «Общее» нельзя удалить.");
        } else {
          showAlert("Не удалось удалить категорию.");
        }
      }).catch(function(err) {
        if (err.message !== "auth_expired") showAlert("Не удалось удалить категорию.");
      });
    });
  };

  // --- факты: инлайн-правка (с пере-эмбеддингом на бэке) + удаление ---
  window._editMemoryFact = function(btn) {
    _factEditId = btn.getAttribute("data-fact-id");
    render();
    var ta = document.getElementById("fact-edit-input");
    if (ta) { ta.focus(); }
  };

  window._cancelFactEdit = function() {
    _factEditId = null;
    render();
  };

  window._saveMemoryFact = function(btn) {
    var ta = document.getElementById("fact-edit-input");
    var content = (ta && ta.value || "").trim();
    if (!content) return;
    var factId = btn.getAttribute("data-fact-id");
    var catId = btn.getAttribute("data-cat-id");
    apiFetch("/miniapp/api/v1/memory/facts/" + encodeURIComponent(factId), {
      method: "PATCH", body: { content: content }
    }).then(function(res) {
      if (res && (res.ok || res.fact)) {
        var data = state.memoryFacts[catId];
        if (data && data.facts) {
          for (var i = 0; i < data.facts.length; i++) {
            if (data.facts[i].id === factId) {
              data.facts[i].content = (res.fact && res.fact.content) || content;
              if (res.fact && res.fact.tier) { data.facts[i].tier = res.fact.tier; }
              break;
            }
          }
        }
        _factEditId = null;
        if (!_patchMemoryFactsBody(catId)) { render(); }  // только тело категории, без рефетча
      } else if (res && res.detail === "embedding_unavailable") {
        showAlert("Поиск по памяти временно недоступен — правка не сохранена, попробуйте позже.");
      } else if (res && res.detail === "memory_not_found") {
        showAlert("Факт не найден — обновляю.");
        _factEditId = null;
        var dmf = state.memoryFacts[catId];
        var removedNf = false;
        if (dmf && dmf.facts) {
          var beforeNf = dmf.facts.length;
          dmf.facts = dmf.facts.filter(function(f) { return f.id !== factId; });
          removedNf = dmf.facts.length !== beforeNf;  // минус только при фактическом удалении (R1)
        }
        var cmf = _memCat(catId);
        if (removedNf && cmf && typeof cmf.fact_count === "number" && cmf.fact_count > 0) { cmf.fact_count -= 1; }
        if (_patchMemoryFactsBody(catId)) { _patchMemoryCount(catId); } else { render(); }
      } else {
        showAlert("Не удалось сохранить факт.");
      }
    }).catch(function(err) {
      if (err.message !== "auth_expired") showAlert("Не удалось сохранить факт.");
    });
  };

  window._deleteMemoryFact = function(btn) {
    var factId = btn.getAttribute("data-fact-id");
    var catId = btn.getAttribute("data-cat-id");
    showPopup("Удалить этот факт?", function() {
      apiFetch("/miniapp/api/v1/memory/facts/" + encodeURIComponent(factId), {
        method: "DELETE"
      }).then(function(res) {
        if ((res && res.ok) || (res && res.detail === "memory_not_found")) {
          _factEditId = null;
          var data = state.memoryFacts[catId];
          var removed = false;
          if (data && data.facts) {
            var before = data.facts.length;
            data.facts = data.facts.filter(function(f) { return f.id !== factId; });
            removed = data.facts.length !== before;  // минусуем счётчик только если реально убрали (анти-дубль, R1)
          }
          var c = _memCat(catId);
          if (removed && c && typeof c.fact_count === "number" && c.fact_count > 0) { c.fact_count -= 1; }
          if (_patchMemoryFactsBody(catId)) { _patchMemoryCount(catId); } else { render(); }
        } else {
          showAlert("Не удалось удалить факт.");
        }
      }).catch(function(err) {
        if (err.message !== "auth_expired") showAlert("Не удалось удалить факт.");
      });
    });
  };

  window._loadNextWeek = function() { loadNextWeek(); };

  window._startChannelLink = function() {
    clearChannelLinkPoll();
    channelLinkApiFetch("/miniapp/api/v1/channel-link/start", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({}),
    }).then(function(res) {
      if (!res || !res.sent_to_chat) {
        showAlert("Не удалось создать ссылку. Попробуй позже.");
        return;
      }
      // Backend отправил deep-link в bot чат. Закрываем miniapp —
      // юзер найдёт ссылку в чате с ботом.
      var bridge = (window.Telegram && window.Telegram.WebApp) || window.WebApp;
      if (bridge && typeof bridge.close === "function") {
        try { bridge.close(); return; } catch (e) {}
      }
      // Fallback when bridge.close недоступен: in-page banner.
      var slot = document.getElementById("channel-link-slot");
      if (slot) {
        slot.innerHTML =
          '<div class="card" style="background:#dcfce7;border-color:#86efac">' +
            '<div class="card-title">✓ Ссылка отправлена в чат с ботом</div>' +
            '<div class="card-subtitle" style="margin-top:6px">Открой чат и тапни ссылку.</div>' +
          '</div>';
      }
      return;
    }).catch(function(err) {
      if (err && err.message === "auth_expired") return;
      if (err && err.status === 429) {
        showAlert("Слишком много попыток. Попробуй через 30 минут.");
      } else if (err && err.status === 409) {
        showAlert("Аккаунт уже привязан.");
      } else {
        showAlert("Не удалось создать ссылку. Попробуй позже.");
      }
    });
  };

  // (Legacy card UI removed — chat-based delivery теперь handles ссылку)

  window._consumeChannelLink = function(rawToken, opts) {
    _channelLinkLastErrorMessage = null;
    var silent = !!(opts && opts.silent);
    var token = (rawToken || "").replace(/^lnk_/, "");
    if (!isValidChannelLinkToken(token)) {
      _channelLinkLastErrorMessage = channelLinkErrorMessage("not_found_or_expired");
      if (!silent) showAlert(_channelLinkLastErrorMessage);
      return Promise.resolve(false);
    }
    return channelLinkApiFetch("/miniapp/api/v1/channel-link/consume", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ raw_token: token }),
    }).then(function(res) {
      if (res && res.ok) return true;
      _channelLinkLastErrorMessage = channelLinkErrorMessage(res && res.error);
      if (!silent) showAlert(_channelLinkLastErrorMessage);
      return false;
    }).catch(function(err) {
      if (err && err.message === "auth_expired") return false;
      var response = (err && err.response) || {};
      _channelLinkLastErrorMessage = channelLinkErrorMessage(response.error || response.detail);
      if (!silent) showAlert(_channelLinkLastErrorMessage);
      return false;
    });
  };

  window._cancelChannelLink = function(rawToken) {
    _channelLinkView = null;
    var token = (rawToken || "").replace(/^lnk_/, "");
    if (!isValidChannelLinkToken(token)) {
      showAlert("Не удалось отменить связь. Закрой приложение вручную.");
      closeMiniAppOrClear();
      return Promise.resolve(false);
    }
    return channelLinkApiFetch("/miniapp/api/v1/channel-link/cancel", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ raw_token: token }),
    }).then(function() {
      closeMiniAppOrClear();
      return true;
    }).catch(function() {
      showAlert("Не удалось отменить связь. Закрой приложение вручную.");
      closeMiniAppOrClear();
      return false;
    });
  };

  window._markShoppingBought = function(itemId, checkEl) {
    // Optimistic UX: start the animation immediately, don't wait for
    // the server. If the request fails we rollback via render().
