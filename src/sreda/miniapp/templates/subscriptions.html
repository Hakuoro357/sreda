  // R-33 (2026-05-15, Boris): inline accordion — fetch + render items
  // когда юзер раскрыл task с linked checklist'ом прямо в расписании.
  // Lazy: items загружаются на first open. State cache hit re-renders без fetch.
  window._onTaskAccordionToggle = function(detailsEl) {
    if (!detailsEl.open) return;  // collapsed → ничего не делаем
    var checklistId = detailsEl.getAttribute("data-checklist-id");
    if (!checklistId) return;
    var container = detailsEl.querySelector(".task-checklist-items");
    if (!container) return;
    // Already rendered? skip refetch (toggle reuses cache).
    if (container.getAttribute("data-rendered") === "1") return;
    // Codex R1 LOW (R-33 Boris): race guard. open→close→open fast =
    // duplicate fetches. data-loading flag prevents second fetch до
    // первого response. Late response also rejected если accordion
    // was reopened in the meantime (data-loading увеличивается).
    if (container.getAttribute("data-loading") === "1") return;
    container.setAttribute("data-loading", "1");
    container.innerHTML = '<div class="card-subtitle" style="padding:8px 0">Загружаем...</div>';
    var cached = state.checklistDetail[checklistId];
    if (cached && !cached._error) {
      _renderTaskInlineItems(container, cached, checklistId);
      container.removeAttribute("data-loading");
      return;
    }
    // Fetch fresh
    apiFetch(
      "/miniapp/api/v1/checklist/" + encodeURIComponent(checklistId)
    ).then(function(detail) {
      // Drop late response если accordion закрыт (race с close).
      if (!detailsEl.open) {
        container.removeAttribute("data-loading");
        container.innerHTML = "";  // clear "Загружаем..." stub
        return;
      }
      if (!detail || detail._error) {
        container.innerHTML = '<div class="error-state">Не удалось загрузить список.</div>';
        container.removeAttribute("data-loading");
        return;
      }
      state.checklistDetail[checklistId] = detail;
      _renderTaskInlineItems(container, detail, checklistId);
      container.removeAttribute("data-loading");
    }).catch(function() {
      container.innerHTML = '<div class="error-state">Не удалось загрузить список.</div>';
      container.removeAttribute("data-loading");
    });
  };

  // Render checklist items inline под task'ом в расписании. Items
  // toggle-able (reuse _toggleChecklistItem); + кнопка «✕ Удалить список».
  function _renderTaskInlineItems(container, detail, checklistId) {
    var items = detail.items || [];
    var html = '<div style="background:rgba(0,0,0,0.03);border-radius:6px;padding:10px 12px">';
    if (items.length === 0) {
      html += '<div class="card-subtitle" style="padding:6px 0">Пунктов пока нет.</div>';
    } else {
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var isDone = it.status === 'done';
        var isCancelled = it.status === 'cancelled';
        var mark = isDone ? "☑" : (isCancelled ? "✗" : "☐");
        var textStyle = isDone
          ? 'text-decoration:line-through;opacity:0.55'
          : (isCancelled ? 'opacity:0.45;color:var(--tg-theme-hint-color,#999)' : '');
        var rowStyle = 'display:flex;gap:10px;padding:6px 0;align-items:flex-start';
        if (!isCancelled && detail.status === "active") {
          rowStyle += ';cursor:pointer';
          html += '<div style="' + rowStyle + '" '
            + 'onclick="window._toggleChecklistItem(this, \'' + escAttr(it.id) + '\')">';
        } else {
          html += '<div style="' + rowStyle + '">';
        }
        html += '<div class="cl-mark" style="font-size:18px;line-height:1.2;flex-shrink:0;min-width:20px">' + mark + '</div>';
        html += '<div class="cl-text" style="flex:1;' + textStyle + '">' + escHtml(it.title) + '</div>';
        html += '</div>';
      }
    }
    // Delete-list button (text variant per Boris choice 2026-05-15)
    if (detail.status === "active") {
      html += '<div style="margin-top:10px;text-align:right">';
      html += '<button type="button" class="checklist-archive-btn" '
        + 'data-checklist-id="' + escAttr(checklistId) + '" '
        + 'data-checklist-title="' + escAttr(detail.title) + '" '
        + 'onclick="event.stopPropagation();window._archiveChecklistFromBtn(this);return false;" '
        + 'style="background:none;border:1px solid rgba(229,57,53,0.4);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--tg-theme-destructive-text-color,#e53935)">'
        + '✕ Удалить список</button>';
      html += '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
    container.setAttribute("data-rendered", "1");
  }

  // R-31 (2026-05-15): button click handler — reads data-attrs.
  // Priority: button's own data-checklist-id (R-33 detail view),
  // fallback to closest <details> ancestor (R-31 list view).
  window._archiveChecklistFromBtn = function(btn) {
    var checklistId = btn.getAttribute('data-checklist-id');
    var title = btn.getAttribute('data-checklist-title') || '';
    if (!checklistId) {
      var card = btn.closest('details.card[data-checklist-id]');
      if (!card) return;
      checklistId = card.getAttribute('data-checklist-id');
      title = card.getAttribute('data-checklist-title') || '';
    }
    if (!checklistId) return;
    window._archiveChecklist(checklistId, title);
  };

  // R-31 (2026-05-15): archive checklist from Mini App. Soft-delete
  // через `archive_list` backend (status='archived'). UI animate
  // fade-out → remove DOM + state prune, без перезагрузки страницы.
  // Confirmation per user request («Удалять с подтверждением»).
  window._archiveChecklist = function(checklistId, title) {
    showPopup(
      "Удалить список «" + title + "» вместе со всеми пунктами?",
      function() {
        apiFetch(
          "/miniapp/api/v1/checklist/" + encodeURIComponent(checklistId) + "/archive",
          { method: "POST" }
        ).then(function(res) {
          if (res && res.ok) {
            // Optimistic UI: fade-out card → remove DOM → prune state.
            // CSS.escape: defensive against IDs с special chars (Qwen MINOR 7).
            var safeId = (window.CSS && window.CSS.escape)
              ? window.CSS.escape(checklistId)
              : checklistId.replace(/(["\\])/g, '\\$1');
            var card = document.querySelector(
              'details.card[data-checklist-id="' + safeId + '"]'
            );
            if (card) {
              card.style.transition = "opacity 220ms ease, max-height 220ms ease";
              card.style.opacity = "0";
              card.style.maxHeight = card.offsetHeight + "px";
              setTimeout(function() {
                card.style.maxHeight = "0";
                card.style.overflow = "hidden";
              }, 50);
              setTimeout(function() {
                if (card.parentNode) {
                  card.parentNode.removeChild(card);
                }
              }, 280);
            }
            // Prune state.checklists.checklists so subsequent renders
            // не показывают только что удалённый.
            if (
              state.checklists &&
              state.checklists.checklists &&
              Array.isArray(state.checklists.checklists)
            ) {
              state.checklists.checklists = state.checklists.checklists.filter(
                function(c) { return c.id !== checklistId; }
              );
              // Codex R1 MINOR 3: если был последний — full re-render
              // чтобы показать empty-state placeholder, а не пустой header.
              if (state.checklists.checklists.length === 0) {
                setTimeout(function() { render(); }, 320); // после fade animation
              }
            }
            // R-33 R2 MINOR (Codex): if user был в detail view (#/checklists/{id}),
            // нужно navigate обратно на /checklists list, otherwise страница
            // остаётся stale (показывает archived checklist).
            if (state.checklistDetail && state.checklistDetail[checklistId]) {
              delete state.checklistDetail[checklistId];
            }
            var currentRoute = (location.hash || "").replace(/^#/, "");
            if (currentRoute.indexOf("/checklists/" + checklistId) === 0) {
              setTimeout(function() {
                location.hash = "#/checklists";
              }, 320);
            }
            // R-33 Boris update 2026-05-15: schedule view может содержать
            // linked task (accordion с этим checklist). После archive
            // task → unlinked → counter и accordion должны исчезнуть.
            // Force schedule re-fetch чтобы _task_dict вернул свежий
            // checklist_id=NULL.
            if (state.schedule) {
              state.schedule = null;
              if (currentRoute === "/schedule") {
                setTimeout(function() { loadSchedule(); }, 350);
              }
            }
            // Haptic confirmation
            try {
              if (
                window.Telegram && window.Telegram.WebApp &&
                window.Telegram.WebApp.HapticFeedback
              ) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
              }
            } catch (e) {}
          } else {
            showAlert("Не удалось удалить список.");
          }
        }).catch(function() {
          showAlert("Не удалось удалить список.");
        });
      }
    );
  };

  // Family-member edit modal. Opens with the current row's fields
  // prefilled. Uses the same Telegram BackButton hijack as the menu
  // editor so Android's system-back closes the modal without

  window._editFamilyMember = function(memberId) {
    var member = null;
    var items = (state.family && state.family.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === memberId) { member = items[i]; break; }
    }
    if (!member) return;

    var prevBackHandler = _backHandler;

    var overlay = document.createElement("div");
    overlay.style.cssText =
      "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);" +
      "z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;";

    function closeModal() {
      if (!overlay.parentNode) return;
      document.body.removeChild(overlay);
      if (tg && tg.BackButton) {
        try { tg.BackButton.offClick(closeModal); } catch (e) {}
        _backHandler = prevBackHandler;
        if (_backHandler) tg.BackButton.onClick(_backHandler);
        else tg.BackButton.hide();
      }
    }

    overlay.onclick = function(e) {
      if (e.target === overlay) closeModal();
    };

    if (tg && tg.BackButton) {
      if (_backHandler) { try { tg.BackButton.offClick(_backHandler); } catch (e) {} }
      _backHandler = closeModal;
      tg.BackButton.onClick(closeModal);
      tg.BackButton.show();
    }

    var modal = document.createElement("div");
    modal.style.cssText =
      "background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000);" +
      "border-radius:12px;padding:16px;max-width:400px;width:100%;" +
      "max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.3);";

    var roleOptions = "";
    var roles = ["self", "spouse", "child", "parent", "other"];
    for (var r = 0; r < roles.length; r++) {
      var sel = roles[r] === member.role ? " selected" : "";
      roleOptions += '<option value="' + roles[r] + '"' + sel + '>' +
                     escHtml(_FAMILY_ROLE_LABELS[roles[r]]) + '</option>';
    }

    var inputStyle = "width:100%;padding:10px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:15px;box-sizing:border-box";

    modal.innerHTML =
      '<h2 style="margin:0 0 12px 0;font-size:18px">Редактировать: ' + escHtml(member.name) + '</h2>' +

      '<label class="card-subtitle" style="display:block;margin:8px 0 4px 0">Имя</label>' +
      '<input id="_fm_name" type="text" style="' + inputStyle + '" value="' + escHtml(member.name) + '">' +

      '<label class="card-subtitle" style="display:block;margin:12px 0 4px 0">Кто</label>' +
      '<select id="_fm_role" style="' + inputStyle + '">' + roleOptions + '</select>' +

      '<label class="card-subtitle" style="display:block;margin:12px 0 4px 0">Год рождения</label>' +
      '<input id="_fm_birth_year" type="number" min="1900" max="2100" placeholder="например, 1988" style="' + inputStyle + '" ' +
      'value="' + (member.birth_year != null ? member.birth_year : "") + '">' +

      '<label class="card-subtitle" style="display:block;margin:12px 0 4px 0">Заметки</label>' +
      '<textarea id="_fm_notes" rows="2" placeholder="аллергии, привычки..." style="' + inputStyle + ';resize:vertical">' +
      escHtml(member.notes || "") + '</textarea>' +

      '<div style="display:flex;gap:8px;margin-top:16px">' +
      '<button id="_fm_cancel" class="btn" style="flex:1;background:rgba(0,0,0,0.08)">Отмена</button>' +
      '<button id="_fm_save" class="btn btn-primary" style="flex:1">Сохранить</button>' +
      '</div>';

    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    document.getElementById("_fm_save").onclick = function() {
      var payload = {
        name: (document.getElementById("_fm_name").value || "").trim(),
        role: document.getElementById("_fm_role").value,
      };
      var by = document.getElementById("_fm_birth_year").value.trim();
      if (by) payload.birth_year = parseInt(by, 10);
      // Notes: always send (empty string clears it). API trims and
      // stores None for empty, so passing "" is fine.
      payload.notes = document.getElementById("_fm_notes").value.trim();
      if (!payload.name) { showAlert("Имя не может быть пустым."); return; }

      var btn = document.getElementById("_fm_save");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-small"></span>';

      apiFetch("/miniapp/api/v1/family/" + memberId, {
        method: "PATCH",
        body: payload,
      }).then(function(res) {
        if (res && res.ok && res.member) {
          // Update state in place for the family list.
          if (state.family && state.family.items) {
            for (var k = 0; k < state.family.items.length; k++) {
              if (state.family.items[k].id === memberId) {
                state.family.items[k] = res.member;
                break;
              }
            }
          }
          closeModal();
          render();  // re-draw family list with updated row
        } else {
          btn.disabled = false;
          btn.innerHTML = "Сохранить";
          showAlert("Не удалось сохранить.");
        }
      }).catch(function() {
        btn.disabled = false;
        btn.innerHTML = "Сохранить";
        showAlert("Не удалось сохранить.");
      });
    };

    document.getElementById("_fm_cancel").onclick = closeModal;
  };

  // -- Init --
  // 2026-04-29: на каждый hashchange — silent re-fetch данных целевой
  // страницы. Mini App'ом юзер часто пользуется паралельно с чатом
  // (попросил бота создать чек-лист → возвращается в Mini App).
  // Старая логика «cache once, never refresh» давала stale view —
  // новый чек-лист появлялся только после полного reopen Mini App.
  // Silent: state НЕ null'им, loadX перезапишет slot атомарно когда
  // ответ придёт. Юзер мгновенно видит знакомую страницу (cached
  // state) + через 100-300мс свежие данные подменяются.
  function _refreshRouteOnEnter() {
    var r = (location.hash || "#/").replace(/^#/, "") || "/";
    if (r === "/reminders" && state.reminders !== null) loadReminders();
    if (r === "/schedule" && state.schedule !== null) loadSchedule();
    if (r === "/menu" && state.weeklyMenu !== null) loadWeeklyMenu();
    if (r === "/shopping" && state.shopping !== null) loadShopping();
    if (r === "/checklists" && state.checklists !== null) loadChecklists();
    if (r === "/recipes" && state.recipes !== null) loadRecipes();
    if (r === "/family" && state.family !== null) loadFamily();
    // Dashboard (/) — через loadData (silent), refresh menu+summary.
    if (r === "/" || r === "") loadData({silent: true});
  }
  window.addEventListener("hashchange", function() {
    render();
    _refreshRouteOnEnter();
  });

  // Invalidate cached server state when the Mini App regains focus —
  // the user likely went to chat and asked the bot to mutate something
  // (save recipes, add shopping, edit family). Without this, the UI
  // keeps showing stale data until the user force-closes and reopens.
  // Fires on tab-focus (visibility) and on Telegram viewport events.
  var _lastRefreshAt = 0;
  function _refetchAllOnReturn() {
    // Throttle: at most once every 2s. Telegram fires viewportChanged
    // frequently on keyboard open/close, don't bombard the server.
    var now = Date.now();
    if (now - _lastRefreshAt < 2000) return;
    _lastRefreshAt = now;
    // Silent refresh: we don't null state slots or flip loading=true,
    // because that would replace visible content with a spinner and
    // swallow the user's first tap on a dashboard card. Instead each
    // loader overwrites its slot on resolve and re-renders, giving
    // an atomic "old data → new data" swap with no blank in-between.
    loadData({silent: true});
    // Page-specific loaders are only fired when the corresponding
    // route is currently visible — otherwise re-fetching a screen the
    // user isn't looking at wastes bandwidth. The hashchange handler
    // will re-trigger them lazily if the user navigates there.
    var route = getRoute();
    if (route === "/reminders" && state.reminders !== null) loadReminders();
    if (route === "/schedule" && state.schedule !== null) loadSchedule();
    if (route === "/menu" && state.weeklyMenu !== null) loadWeeklyMenu();
    if (route === "/shopping" && state.shopping !== null) loadShopping();
    if (route === "/checklists" && state.checklists !== null) loadChecklists();
    if (route === "/recipes" && state.recipes !== null) loadRecipes();
    if (route === "/family" && state.family !== null) loadFamily();
    if (route === "/memory" && state.memory !== null) loadMemory();
    // Recipe detail page (#/recipes/{id}) — refetch currently viewed recipe.
    var detailMatch = route.match(/^\/recipes\/(.+)$/);
    if (detailMatch && state.recipeDetail[detailMatch[1]] !== undefined) {
      loadRecipeDetail(detailMatch[1]);
    }
  }
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") _refetchAllOnReturn();
  });
  if (tg && typeof tg.onEvent === "function") {
    // Telegram-specific: fires when the Mini App is re-opened from the
    // tray or when the user returns from another screen within Telegram.
    try { tg.onEvent("themeChanged", _refetchAllOnReturn); } catch (e) {}
  }
  window.addEventListener("focus", _refetchAllOnReturn);
  loadData();
  }  // end of _mainInit

  // 2026-06-04 (vex-assistant#102): with the SDK loaded async, on a COLD first
  // open window.Telegram can appear AFTER the bootstrap already proceeded via
  // the hash fallback, so tg.ready()/expand() never fired and Telegram kept its
  // loading overlay over the already-rendered content → blank on first open,
  // fine on refresh (SDK cached). Poll for the SDK and signal ready()/expand()
  // the moment it appears, regardless of bootstrap timing. (function decl is
  // hoisted, so _mainInit above can call it.)
  var _sdkReadyCalled = false;
  function _callSdkReadyOnce() {
    if (_sdkReadyCalled) return true;
    var app = (window.Telegram && window.Telegram.WebApp) || window.WebApp;
    if (!(app && typeof app.ready === "function")) return false;
    // Set the one-shot flag only AFTER ready() actually succeeds, so a thrown
    // ready() leaves the poll free to retry (Codex MINOR).
    try { app.ready(); } catch (e) { return false; }
    _sdkReadyCalled = true;
    try { if (typeof app.expand === "function") app.expand(); } catch (e) {}
    return true;
  }
  if (!_callSdkReadyOnce()) {
    var _sdkPollTries = 0;
    var _sdkPollTimer = setInterval(function () {
      _sdkPollTries += 1;
      // ~60s of 100ms polls — generous even for a very slow async SDK load;
      // beyond that the network is broken and the API calls fail anyway.
      if (_callSdkReadyOnce() || _sdkPollTries > 600) clearInterval(_sdkPollTimer);
    }, 100);
    // Belt-and-suspenders: also signal on window 'load', in case the async SDK
    // resolves around/after it and outside the poll window (Codex MAJOR).
    try { window.addEventListener("load", _callSdkReadyOnce); } catch (e) {}
  }
  _bootstrap();
})();
</script>
