name: ci-tests

# Мера A пост-мортема vex-assistant#331: тест-свит в CI (не прод-скрипты).
# Job unit — весь свит на SQLite на каждый PR (ловит большинство регрессий ДО мержа).
# Job pg-integration — реальный Postgres + begin-событие #138: ловит транзакционный класс #331
# (unit-свит на SQLite его не видел: `SET TRANSACTION` там не падает).
# Деплой остаётся РУЧНЫМ (ПРАВИЛО #3) — CI только проверяет, не катит.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/onboard_smoke.py'
      - 'migrations/**'
      - 'pyproject.toml'
      - '.github/workflows/ci-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/onboard_smoke.py'
      - 'migrations/**'
      - 'pyproject.toml'
      - '.github/workflows/ci-tests.yml'

# Экономим минуты: новый пуш в ту же ветку отменяет прошлый прогон.
concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (SQLite, без pg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Прогон unit-свита
        # test_doc_on_disk_is_fresh — ЛОКАЛЬНО-девелоперский чек: сверяет ЛОКАЛЬНЫЙ генерируемый
        # docs/internal/dev/SREDA_CAPABILITIES.md (он GITIGNORED, в репо не коммитится) с build_document().
        # На CI-checkout файла НЕТ → тест неприменим (не «свежесть», а «файла нет»). Исключаем из CI.
        # Свежесть карты в CI enforced через test_doc_hash_pinned_for_ci (аудит 2026-07-18:
        # sha256 эталонного build_document() коммитится в репо — drift ловится на каждый PR).
        run: >-
          uv run --all-extras python -m pytest tests/unit -m "not pg"
          --deselect tests/unit/test_capabilities_map.py::test_doc_on_disk_is_fresh -q

  functional:
    name: functional (E2E-тракт #133, сеть запрещена)
    # Аудит 2026-07-18 (MAJOR): единственный сквозной тракт «HTTP → planner →
    # executor → БД» раньше не бежал НИГДЕ — регрессия шва create_task ушла
    # в main незамеченной. Шов-тесты (test_seams) бегут везде; трактовые
    # тесты построены на chat-скиле из ПРИВАТНОГО пакета sreda-private-features
    # и на публичном checkout честно скипаются (importorskip в conftest) —
    # локально у владельца (плагин установлен) сюит полный.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Прогон functional-свита
        # M17 (R1): раньше при полностью skipped E2E (importorskip без приватного
        # пакета) job был ЗЕЛЁНЫМ, ничего не утверждая — ложный гейт. Теперь:
        # реальный провал тракта → падаем с его кодом; всё skipped (тракт не
        # исполнился) → падаем явно; есть passed → зелёный по-настоящему.
        run: |
          out=$(uv run --all-extras python -m pytest tests/functional -q 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if ! echo "$out" | grep -qE "[1-9][0-9]* passed"; then
            echo "::error::functional E2E-тракт НИЧЕГО не исполнил (весь skipped) — приватный пакет sreda-private-features не установлен на этом runner'е, тракт не гейтит. Установите плагин на CI-runner (M17)."
            exit 1
          fi

  pg-integration:
    name: pg-integration (реальный Postgres, класс #331)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sreda
          POSTGRES_PASSWORD: sreda
          POSTGRES_DB: sreda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sreda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SREDA_PG_TEST_DSN: postgresql+psycopg://sreda:sreda@localhost:5432/sreda
      # dummy AES-256 ключ (как conftest _DEFAULT_TEST_KEY) — интеграционный тест вне unit-conftest
      SREDA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # RLS red-suites (#138 + vex#360): полная цепочка миграций (роли/политики/гранты =
      # та же механика, что на проде) + LOGIN-пароли тестовым ролям → суиты, которые без
      # роль-DSN'ов скипаются. До этого они бегали только на локальном docker-стенде.
      # ПОРЯДОК ВАЖЕН (R2 sol/субагент): миграции ДО теста #331 — его фикстура делает
      # create_all; на уже созданных таблицах alembic-0001 упал бы DuplicateTable. На
      # мигрированной схеме create_all — no-op (checkfirst).
      - name: Миграции до головы + LOGIN-роли для RLS red-suite
        env:
          SREDA_DATABASE_URL: postgresql+psycopg://sreda:sreda@localhost:5432/sreda
        run: |
          uv run --all-extras alembic upgrade head
          psql postgresql://sreda:sreda@localhost:5432/sreda -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE sreda_app LOGIN PASSWORD 'app'" \
            -c "ALTER ROLE sreda_identity LOGIN PASSWORD 'identity'" \
            -c "ALTER ROLE sreda_maintenance LOGIN PASSWORD 'maintenance'"
      - name: Throwaway-БД для destructive PG-сьютов
        # Аудит 2026-07-18 (MAJOR): quota-concurrency сьюиты и #344 дропают
        # таблицы/схему → их safety-гейты требуют БД с тестовым именем
        # ('*_test'). Держим её ОТДЕЛЬНО от мигрированной `sreda`, чтобы
        # DROP SCHEMA не сносил схему RLS-сьютов.
        run: >-
          psql postgresql://sreda:sreda@localhost:5432/sreda
          -v ON_ERROR_STOP=1 -c "CREATE DATABASE sreda_test"
      - name: Класс #331 на реальном PG (begin-хук #138 × изоляция quota)
        run: uv run --all-extras python -m pytest tests/integration/test_331_tx_isolation_pg.py -m pg -q
      - name: RLS red-suites (#138 изоляция + identity + vex#360 onboard-smoke)
        env:
          SREDA_PG_TEST_DSN_OWNER: postgresql+psycopg://sreda:sreda@localhost:5432/sreda
          SREDA_PG_TEST_DSN_APP: postgresql+psycopg://sreda_app:app@localhost:5432/sreda
          SREDA_PG_TEST_DSN_MAINT: postgresql+psycopg://sreda_maintenance:maintenance@localhost:5432/sreda
          SREDA_PG_TEST_DSN_IDENTITY: postgresql+psycopg://sreda_identity:identity@localhost:5432/sreda
        run: >-
          uv run --all-extras python -m pytest
          tests/integration/test_138_rls_pg.py
          tests/integration/test_138_identity_pg.py
          tests/integration/test_360_onboard_smoke_rls_pg.py -m pg -q
      - name: PG-конкуренция money-path + delivery-контур #344
        # Аудит 2026-07-18 (MAJOR): защита double-spend квот (SERIALIZABLE +
        # retry по SQLSTATE 40001) и reclaim-fence воркеров рассылок на SQLite
        # не воспроизводятся, а в CI эти сьюиты НЕ БЕЖАЛИ: 5 quota-сьютов
        # гейтятся на SREDA_TEST_POSTGRES_URL + DESTRUCTIVE_OPT_IN (CI их не
        # выставлял), а test_344 вообще не был включён в job. Теперь единый
        # контур: throwaway-БД sreda_test (создаётся шагом выше; имя проходит
        # safety-гейт '*_test'), обе переменные выставлены. test_344 читает
        # SREDA_PG_TEST_DSN — перекрываем на шаге: job-level DSN указывает
        # на мигрированную `sreda`, где его DROP SCHEMA не пропустил бы
        # safety-гейт. БЕЗ `-m pg`: 5 quota-сьютов маркера pg не имеют
        # (гейтятся только env'ом) — маркерный фильтр их бы деселектил.
        env:
          SREDA_TEST_POSTGRES_URL: postgresql+psycopg://sreda:sreda@localhost:5432/sreda_test
          SREDA_TEST_POSTGRES_DESTRUCTIVE_OPT_IN: "1"
          SREDA_PG_TEST_DSN: postgresql+psycopg://sreda:sreda@localhost:5432/sreda_test
        run: >-
          uv run --all-extras python -m pytest
          tests/integration/test_344_delivery_contour_pg.py
          tests/integration/test_341_max_chat_id_pg_concurrency.py
          tests/integration/test_fetch_url_quota_postgres_concurrency.py
          tests/integration/test_web_search_quota_postgres_concurrency.py
          tests/integration/test_message_queue_postgres_concurrency.py
          tests/integration/test_conversation_turns_postgres_fk.py
          -q
