name: secret-scan

# Аудит 2026-07-18 (cross-cutting, согласовано с оркестратором): gitleaks
# на каждый PR и push в main. Проект оперирует PG-DSN с паролями, ключами
# шифрования и LLM-токенами — утечка секрета в коммит должна падать красным
# чеком ДО мержа. Отдельный workflow без paths-фильтра: секрет может
# приехать в любом файле (docs/, scripts/, deploy/), а не только в src/**.
# Это СИГНАЛ (как docs-freshness): branch-protection не вводим.
on:
  pull_request:
  push:
    branches: [main]

# Экономим минуты: новый пуш в ту же ветку отменяет прошлый прогон.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (секреты в diff/истории)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks сканирует историю коммитов PR, не только HEAD
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
