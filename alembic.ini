[alembic]
script_location = migrations
# URL намеренно пуст (audit 2026-07-18 db-migrations #8: раньше здесь лежали
# дефолтные креды sreda:sreda@localhost — креды-в-репо как форма). Реальный
# DSN ВСЕГДА подставляет migrations/env.py из settings
# (migration_database_url or database_url) — ini-значение не используется.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
