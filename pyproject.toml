[project]
name = "sreda"
version = "0.1.0"
description = "Sreda MVP backend: FastAPI + LangGraph + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "jinja2>=3.1.0",
  "httpx>=0.28.0",
  "langgraph>=0.6.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  # R-29: pin langchain-openai к 1.x range. Subclass MimoChatOpenAI
  # overrides internal underscore methods (_get_request_payload,
  # _create_chat_result) which являются stable в 1.x но могут drift в
  # 2.x. Compat-test test_mimo_chat_openai.py::test_langchain_openai_signature_compat
  # fails loudly если signatures меняются. Update bound when 2.x evaluated.
  "langchain-openai>=1.1,<2.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.10.0",
  "pymorphy3>=2.0",          # Sub-A10 (Group 3.1) — semantic dedup via lemmatization
  "python-dateutil>=2.9.0",
  "python-multipart>=0.0.26",
  "duckduckgo-search>=6.0.0",
  "readability-lxml>=0.8.1",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "no_sync_thread: opt-out из autouse threading.Thread monkeypatch в test_admin_alerts (для тестов async-функций, использующих asyncio.to_thread)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
