# Issue #68 — llm-trace private storage directory.
#
# Decrypted PII (memories, user text, tool args). Mode 0700 + owner sreda:sreda
# — only sreda user and root can read. Path follows FHS convention for
# private application data (/var/lib/<app>/private) — implicitly excluded
# по defaults of most backup/log-shipping tools.
#
# Deploy:
#   sudo cp deploy/tmpfiles.d/sreda-llm-traces.conf /usr/lib/tmpfiles.d/
#   sudo systemd-tmpfiles --create
#
# Plan: plans/mellow-discovering-conway-final.md, Section 5.
d /var/lib/sreda/private          0700 sreda sreda - -
d /var/lib/sreda/private/llm-traces 0700 sreda sreda - -
